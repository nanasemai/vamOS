# 文档写 =y 但实际只能是模块(依赖 tristate 上限/自动加载), 断言放宽为"已编出"
CONFIG_BT_RFCOMM y|m
CONFIG_LEDS_QCOM_FLASH y|m
CONFIG_TYPEC_QCOM_PMIC y|m
CONFIG_QCOM_BAM_DMUX y|m
# CoreSight 整族在本配置里是 =m（CORESIGHT/CPU_DEBUG/LINKS_AND_SINKS 都是 m），
# ETM4X 是 CPU 追踪源，DT 里有 10 个 arm,coresight-etm4x 节点。
# 关掉会导致那些节点没人认领（不影响用户功能，只丢 perf/CoreSight CPU 追踪）
CONFIG_CORESIGHT_SOURCE_ETM4X y|m
