# RTC 必须内置。原本 =m：修复只在 rootfs 的 .ko 里，只刷 boot.img 是"新内核 + 旧模块"，
# spmi-pmic-arb 拒写 0x6046 的日志洪水照旧（~26GB/天 journal 写入），看着像没修好。
# 而且本项目 initramfs 里没有 .ko，模块化意味着 rootfs 挂载前没有真实时钟。
# 掉回 =n 更糟：/sys/class/rtc/rtc0 直接消失。
CONFIG_RTC_DRV_PM8XXX y
CONFIG_SCSI_UFSHCD y
CONFIG_SCSI_UFS_CRYPTO y
CONFIG_SCSI_UFS_QCOM y
CONFIG_SDM_CAMCC_845 y
