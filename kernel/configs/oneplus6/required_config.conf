# APSS 看门狗（DT: watchdog@17980000，qcom,apss-wdt-sdm845）。
# ABL 若已在跳内核前启动它，=m 时内核早期没人喂 -> SoC 被复位 -> 卡在 fastboot
# 且零报错。qcom_defconfig 本来就是 =y。
CONFIG_QCOM_WDT y
CONFIG_REGULATOR_FIXED_VOLTAGE y
CONFIG_REGULATOR_GPIO y
CONFIG_REGULATOR_QCOM_LABIBB y
CONFIG_REGULATOR_QCOM_RPMH y
