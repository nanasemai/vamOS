# OnePlus 6 关键内核开关断言表 —— 生成/构建后必须核对
# 格式: <符号> <期望值>   期望值 y = 必须内置; y|m = 至少编成模块
# 来源: CLAUDE.md 关键内核配置 + kernel/configs/oneplus6/README.md 硬件映射表(内置列)
# 背景: 用旧 .config 跑 olddefconfig 时, 改名/新增的符号会静默掉成 =n (2026-10 掉过
#       INPUT_QCOM_PMI8998_HAPTICS / VIDEO_LC89821X / HW_RANDOM_QCOM), 本表用于兜底

CONFIG_ARCH_QCOM y
CONFIG_ATH10K_SNOC y
CONFIG_BACKLIGHT_QCOM_WLED y
CONFIG_BATTERY_BQ27XXX y
# bq27411 实际编入的是 bq27xxx_battery_i2c.c，它的 Makefile 门槛是 BQ27XXX_I2C；
# 只断言父项 BATTERY_BQ27XXX 会漏掉"父项 =y 但 I2C 传输没编"的情况
CONFIG_BATTERY_BQ27XXX_I2C y
CONFIG_BATTERY_QCOM_BATTMGR y
CONFIG_BT_HCIUART_QCA y
CONFIG_BT_LE y
CONFIG_CHARGER_QCOM_SMB2 y
# libcamera 软件 ISP 拿 DMA buffer 靠它们：SoftwareIsp 构造时建 DmaBufAllocator，
# 只认 /dev/dma_heap/{linux,cma,reserved,system} 和 /dev/udmabuf，一个都开不出来
# 时 isValid() 为假，simple.cpp 打一行 Warning 就降级，相机"能枚举但出不了图"。
# SYSTEM 是实际生效的那个（本树 CMA 堆叫 default_cma_region，不在 libcamera 名单里），
# UDMABUF 是兜底。CMA 堆 libcamera 用不上但无害（不额外占内存，CMA 区本来就在），
# 一并断言以免有人手滑关掉。
CONFIG_DMABUF_HEAPS y
CONFIG_DMABUF_HEAPS_SYSTEM y
CONFIG_DMABUF_HEAPS_CMA y
CONFIG_DRM_MSM y
CONFIG_DRM_MSM_DSI y
CONFIG_DRM_MSM_DSI_10NM_PHY y
CONFIG_DRM_MSM_MDSS y
CONFIG_DRM_PANEL_SAMSUNG_SOFEF00 y
CONFIG_FW_LOADER_COMPRESS y
CONFIG_FW_LOADER_COMPRESS_XZ y
CONFIG_FW_LOADER_COMPRESS_ZSTD y
CONFIG_HW_RANDOM_QCOM y
CONFIG_I2C_QCOM_CCI y
CONFIG_I2C_QCOM_GENI y
CONFIG_I2C_QUP y
CONFIG_INPUT_PM8941_PWRKEY y
CONFIG_INPUT_QCOM_PMI8998_HAPTICS y
CONFIG_KEYBOARD_GPIO y
CONFIG_LEDS_QCOM_LPG y
CONFIG_MFD_WCD934X y
CONFIG_NFC_NXP_NCI y
CONFIG_NFC_NXP_NCI_I2C y
CONFIG_PHY_QCOM_QMP_UFS y
CONFIG_PHY_QCOM_QUSB2 y
CONFIG_POWER_SEQUENCING_QCOM_WCN y
# /sys/power/{state,restart} 都靠它；=m 时模块没加载前软关机/重启不可靠
CONFIG_POWER_RESET_QCOM_PON y
CONFIG_PSTORE y
CONFIG_PSTORE_RAM y
CONFIG_QCOM_AOSS_QMP y
CONFIG_QCOM_APR y
